[project]
name = "apicostx-api-tools"
version = "0.1.0"
description = "Python SDKs, CLIs, and MCP servers for the APICostX backend and Allie Owl chatbot APIs"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = ["httpx>=0.27,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
apicostx = "apicostx.cli:main"
allie-owl = "owl_cli.acx_owl:main"
apicostx-backend-mcp = "backend_mcp.server:main"
allie-owl-mcp = "owl_mcp.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["apicostx", "allie_owl_client", "owl_cli", "backend_mcp", "owl_mcp"]

[tool.setuptools.package-dir]
apicostx = "backend/python/src/apicostx"
allie_owl_client = "owl/python/allie_owl_client"
owl_cli = "owl"
backend_mcp = "backend/mcp"
owl_mcp = "owl/mcp"
