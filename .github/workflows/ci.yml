name: Client CI

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - run: python -m compileall -q backend/python/src owl/python owl/mcp backend/mcp
      - run: python -m apicostx --help
      - run: python -m unittest discover -s backend/python/tests -v

  typescript:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: [backend/typescript, owl/typescript]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
        working-directory: ${{ matrix.package }}
      - run: npm run test:syntax
        working-directory: ${{ matrix.package }}

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      - run: go test ./...
        working-directory: backend/go
